name: Deploy to cPanel

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (branch, tag, or SHA). Defaults to the branch you run this workflow from.
        required: false
        default: ''

concurrency:
  group: deploy-cpanel-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master')
      )

    env:
      CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
      CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
      CPANEL_SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
      CPANEL_DEPLOY_PATH: ${{ secrets.CPANEL_DEPLOY_PATH }}

    steps:
      - name: Resolve deploy ref
        id: ref
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            REF="${{ inputs.ref }}"
            if [[ -z "$REF" ]]; then
              REF="${{ github.ref_name }}"
            fi
            echo "sha=$REF" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.sha }}
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, intl, mbstring, openssl, pdo, pdo_mysql, tokenizer, xml, xmlwriter, zip
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Composer validate
        run: composer validate --strict

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Verify production build output
        run: |
          test -d public/build
          test "$(find public/build -type f | wc -l)" -gt 0

      # Stage connector into deploy/ (rsync excludes full dev-test-wordpress/).
      # Post-deploy syncs it into $DEPLOYPATH/jiggy when WordPress is present.
      - name: Stage Eco Portal Connector for /jiggy sync
        run: |
          mkdir -p deploy/wordpress-jiggy/eco-portal-connector
          rsync -a --delete \
            dev-test-wordpress/wp-content/plugins/eco-portal-connector/ \
            deploy/wordpress-jiggy/eco-portal-connector/
          test -f deploy/wordpress-jiggy/eco-portal-connector/eco-portal-connector.php

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.CPANEL_SSH_KEY }}

      - name: Register server host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${CPANEL_SSH_PORT}" -H "${CPANEL_SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Verify SSH connection
        run: |
          ssh -p "${CPANEL_SSH_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${CPANEL_SSH_USER}@${CPANEL_SSH_HOST}" \
            "echo SSH_OK && whoami && test -d '${CPANEL_DEPLOY_PATH}' && echo DEPLOY_PATH_OK"

      - name: Deploy release to cPanel (rsync)
        run: |
          rsync -avzr --delete \
            --exclude-from=scripts/deploy/rsync-exclude.txt \
            -e "ssh -p ${CPANEL_SSH_PORT} -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            ./ "${CPANEL_SSH_USER}@${CPANEL_SSH_HOST}:${CPANEL_DEPLOY_PATH}/"

      - name: Run post-deploy commands on server
        run: |
          ssh -p "${CPANEL_SSH_PORT}" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${CPANEL_SSH_USER}@${CPANEL_SSH_HOST}" \
            "export CPANEL_DEPLOY_PATH='${CPANEL_DEPLOY_PATH}' && export CPANEL_PHP_BIN='${{ secrets.CPANEL_PHP_BIN }}' && cd '${CPANEL_DEPLOY_PATH}' && bash scripts/deploy/cpanel-post-deploy.sh"
